<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Media Details | OrbixPlay</title>
    <meta name="description" content="Watch and Download high quality movies and series on OrbixPlay.">
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <link rel="shortcut icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#9333ea">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="artplayer.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #080810; --surface: #12121c; --surface2: #1c1c2a; --surface3: #252535;
            --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
            --text: #f0f0f8; --text-dim: #9090b0; --text-muted: #55556a;
            --accent: #9333ea; --accent2: #a855f7; --accent-glow: rgba(147,51,234,0.3);
            --accent-glass: rgba(147,51,234,0.12); --green: #22c55e; --gold: #f59e0b;
            --font: "Outfit", sans-serif; --radius-sm: 8px; --radius-md: 14px; --nav-h: 56px;
            --backdrop-gradient: linear-gradient(to bottom, rgba(8,8,16,0.1) 0%, rgba(8,8,16,0.55) 50%, var(--bg) 100%);
            --backdrop-brightness: brightness(0.28);
            --title-color: #ffffff;
            --nav-bg: rgba(8,8,16,0.92);
        }
        [data-theme="light"] {
            --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --surface3: #e2e8f0;
            --border: rgba(0,0,0,0.06); --border2: rgba(0,0,0,0.10);
            --text: #0f172a; --text-dim: #334155; --text-muted: #64748b;
            --accent: #7c3aed; --accent2: #8b5cf6; --accent-glow: rgba(124,58,237,0.15);
            --accent-glass: rgba(124,58,237,0.08);
            --backdrop-gradient: linear-gradient(to bottom, rgba(248,250,252,0.15) 0%, rgba(248,250,252,0.65) 50%, var(--bg) 100%);
            --backdrop-brightness: brightness(0.68);
            --title-color: var(--text);
            --nav-bg: rgba(248,250,252,0.92);
        }
        html { scroll-behavior: smooth; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }

        /* NAV */
        .m-nav { position: sticky; top: 0; z-index: 200; height: var(--nav-h); background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; }
        .m-nav-btn { width: 38px; height: 38px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border2); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 0.1s; }
        .m-nav-btn:active { transform: scale(0.92); }
        .m-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); flex: 1; justify-content: center; }
        .m-logo img { width: 26px; height: 26px; border-radius: 7px; }
        .m-logo-text { font-size: 17px; font-weight: 800; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* BACKDROP */
        .m-backdrop { position: relative; width: 100%; min-height: 230px; overflow: hidden; background: var(--surface); }
        .m-backdrop-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: var(--backdrop-brightness) blur(4px); transform: scale(1.06); }
        .m-backdrop-gradient { position: absolute; inset: 0; background: var(--backdrop-gradient); }
        .m-backdrop-content { position: relative; display: flex; align-items: flex-start; padding: 16px 14px 20px; gap: 13px; }

        /* POSTER */
        .m-poster-wrap { width: 100px; height: 148px; flex-shrink: 0; border-radius: var(--radius-md); overflow: hidden; background: var(--surface2); border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 12px 32px rgba(0,0,0,0.75), 0 0 0 1px rgba(147,51,234,0.2); }
        .m-poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .m-hero-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; padding-top: 8px; }
        .m-tags { display: flex; flex-wrap: wrap; gap: 5px; }
        .m-platform-tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(147,51,234,0.2); border: 1px solid rgba(147,51,234,0.4); color: #c084fc; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
        .m-genre-pill { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: var(--text-dim); font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
        .m-title { font-size: 14px; font-weight: 800; line-height: 1.3; color: var(--title-color); word-break: break-word; }
        .m-meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
        .m-rating { display: inline-flex; align-items: center; gap: 3px; background: rgba(245,158,11,0.18); border: 1px solid rgba(245,158,11,0.35); color: var(--gold); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
        .m-pill { background: rgba(255,255,255,0.08); border: 1px solid var(--border2); color: var(--text-dim); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
        .m-age-pill { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
        /* Inline synopsis in hero */
        .m-hero-synopsis { font-size: 11px; color: rgba(200,200,220,0.8); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; }

        /* MAIN */
        .m-main { padding: 12px 14px 100px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

        /* ACTION BAR */
        .m-action-bar { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; }
        .m-watch-btn { height: 46px; background: linear-gradient(135deg, #a855f7, #7c3aed); border: none; border-radius: var(--radius-md); color: #fff; font-size: 14px; font-weight: 700; font-family: var(--font); display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; box-shadow: 0 6px 20px var(--accent-glow); transition: transform 0.15s; }
        .m-watch-btn:active { transform: scale(0.97); }
        .m-icon-btn { width: 46px; height: 46px; border-radius: var(--radius-md); background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; flex-shrink: 0; }
        .m-icon-btn:active { transform: scale(0.93); }
        #wishlistBtn.active { background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.4); color: #f87171; }

        /* SYNOPSIS */
        .m-synopsis-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; }
        .m-synopsis-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .m-synopsis-text { font-size: 13px; color: var(--text-dim); line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        .m-synopsis-text.expanded { -webkit-line-clamp: unset; overflow: visible; }
        .m-read-more { font-size: 12px; color: var(--accent2); font-weight: 600; cursor: pointer; background: none; border: none; padding: 6px 0 0; display: block; font-family: var(--font); }

        /* SPECS */
        .m-specs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }
        .m-spec-item { background: var(--surface); padding: 11px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
        .m-spec-label { font-size: 9px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
        .m-spec-val { font-size: 13px; font-weight: 700; color: var(--text); }

        /* SECTION HEADER */
        .m-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .m-section-title { font-size: 17px; font-weight: 800; color: var(--text); }
        .m-ep-count-badge { background: var(--accent-glass); border: 1px solid rgba(147,51,234,0.3); color: #c084fc; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }

        /* SEASON DROPDOWN */
        .m-season-dropdown-wrap { position: relative; }
        .m-season-select-display { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1.5px solid var(--border2); border-radius: var(--radius-md); padding: 12px 14px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text); transition: border-color 0.15s; gap: 8px; }
        .m-season-select-display:active { border-color: var(--accent2); }
        .m-season-select-display span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
        .m-season-drop-menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-md); z-index: 50; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); animation: slideDown 0.18s ease; max-height: 280px; overflow-y: auto; }
        @keyframes slideDown { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
        #seasonSelectorMobile { display: flex; flex-direction: column; width: 100%; }
        .mobile-season-card { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: transparent; border: none; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s; width: 100%; min-width: unset; border-radius: 0; gap: 12px; }
        .mobile-season-card:last-child { border-bottom: none; }
        .mobile-season-card:active { background: var(--surface3); }
        .mobile-season-card.active { background: rgba(147,51,234,0.12); }
        .mobile-season-card span { font-size: 12px; font-weight: 700; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
        .mobile-season-card.active span { color: #e9d5ff; }
        .season-badge-group { display: flex; align-items: center; gap: 6px; }
        .season-ep-badge { font-size: 10px; font-weight: 600; color: var(--text-muted); background: var(--surface3); padding: 2px 7px; border-radius: 10px; }
        .mobile-season-card.active .season-ep-badge { background: rgba(147,51,234,0.3); color: #c084fc; }
        .mobile-season-card i { display: none !important; }

        /* EPISODE LIST - matches app.js class names */
        .mobile-episodes-list { display: flex; flex-direction: column; gap: 8px; }

        .mobile-ep-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 10px; position: relative; overflow: hidden; transition: background 0.12s; }
        .mobile-ep-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border2); transition: background 0.15s; }
        .mobile-ep-card:active { background: var(--surface2); }
        .mobile-ep-card:active::before { background: var(--accent2); }

        .mobile-ep-num { font-size: 15px; font-weight: 800; color: var(--text-muted); min-width: 24px; text-align: center; flex-shrink: 0; }

        .mobile-ep-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }

        .mobile-ep-title-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

        .mobile-ep-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

        .ep-badge-new { background: rgba(34,197,94,0.18); border: 1px solid rgba(34,197,94,0.4); color: #4ade80; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; flex-shrink: 0; }

        .mobile-ep-specs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .mobile-ep-specs span { font-size: 11px; color: var(--text-muted); font-weight: 500; }

        .ep-quality-tag { background: rgba(147,51,234,0.18); border: 1px solid rgba(147,51,234,0.3); color: #a78bfa; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; }

        .mobile-ep-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }

        .ep-action-btn-play { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px var(--accent-glow); transition: transform 0.12s; }
        .ep-action-btn-play:active { transform: scale(0.87); }

        .ep-action-btn-dl { width: 36px; height: 36px; border-radius: 50%; background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.35); color: var(--green); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.12s; }
        .ep-action-btn-dl:active { transform: scale(0.87); }

        /* LOADER */
        .m-loader { display: flex; align-items: center; justify-content: center; min-height: 120px; }
        .loader { display: flex; align-items: center; justify-content: center; min-height: 120px; flex-direction: column; gap: 12px; }
        .m-spinner, .spinner { width: 34px; height: 34px; border: 3px solid var(--border2); border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* PLAYER */
        .m-player-overlay { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; flex-direction: column; }
        .m-player-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px; }
        .m-player-title { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); }
        .m-player-close { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .m-player-ctrl-btn { height: 34px; padding: 0 10px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); font-size: 11px; font-weight: 700; font-family: var(--font); display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; transition: background 0.15s; flex-shrink: 0; }
        .m-player-ctrl-btn:active { background: var(--surface3); }
        .m-player-body { flex: 1; min-height: 0; overflow: hidden; position: relative; }
        #artplayerContainer { width: 100%; height: 100%; }

        /* SOURCE PANEL */
        .source-panel { position: absolute; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(12,12,20,0.97); border-top: 1px solid var(--border2); border-radius: 18px 18px 0 0; padding: 12px 14px 32px; backdrop-filter: blur(20px); animation: slideUp 0.28s cubic-bezier(0.34,1.2,0.64,1); max-height: 75%; overflow-y: auto; }
        .source-panel-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 14px; }
        .source-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .source-panel-title { font-size: 15px; font-weight: 800; color: var(--text); }
        .source-panel-close { width: 30px; height: 30px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .source-list { display: flex; flex-direction: column; gap: 8px; }
        .source-item { display: flex; align-items: center; gap: 12px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; cursor: pointer; transition: all 0.15s; }
        .source-item:active { background: var(--surface3); }
        .source-item.active { border-color: var(--accent2); background: rgba(147,51,234,0.15); }
        .source-item-num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface3); border: 1px solid var(--border2); font-size: 12px; font-weight: 800; color: var(--text-muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .source-item.active .source-item-num { background: var(--accent); border-color: var(--accent); color: #fff; }
        .source-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .source-item-server { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .source-item.active .source-item-server { color: #e9d5ff; }
        .source-item-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .src-fmt-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
        .src-fmt-m3u8 { background: rgba(34,197,94,0.18); border: 1px solid rgba(34,197,94,0.35); color: #4ade80; }
        .src-fmt-mp4 { background: rgba(59,130,246,0.18); border: 1px solid rgba(59,130,246,0.35); color: #60a5fa; }
        .src-fmt-mkv { background: rgba(245,158,11,0.18); border: 1px solid rgba(245,158,11,0.35); color: #fbbf24; }
        .src-fmt-other { background: rgba(255,255,255,0.08); border: 1px solid var(--border2); color: var(--text-muted); }
        .src-quality-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: rgba(147,51,234,0.18); border: 1px solid rgba(147,51,234,0.3); color: #a78bfa; }
        .source-item-play { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); border: none; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; box-shadow: 0 3px 10px var(--accent-glow); }
        .source-item.active .source-item-play { background: #22c55e; box-shadow: 0 3px 10px rgba(34,197,94,0.3); }

        /* DOWNLOAD MODAL */
        .m-modal-overlay { position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,0.75); display: flex; align-items: flex-end; }
        .m-modal { background: var(--surface); border-top: 1px solid var(--border2); border-radius: 22px 22px 0 0; padding: 20px 16px 44px; width: 100%; max-height: 82vh; overflow-y: auto; animation: slideUp 0.26s cubic-bezier(0.34,1.2,0.64,1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .m-modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 18px; }
        .m-modal-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: var(--text); }
        .m-modal-close-btn { width: 100%; height: 46px; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: var(--radius-md); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 14px; font-family: var(--font); }

        /* DL CARDS */
        .dl-stream-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .dl-stream-info { display: flex; flex-direction: column; gap: 4px; }
        .dl-quality-row { display: flex; align-items: center; gap: 8px; }
        .dl-quality-badge { background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
        .dl-server-tag { font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .dl-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .dl-loader { gap: 10px; }
        .copy-link-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface3); border: 1px solid var(--border2); color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dl-action-btn { height: 34px; background: var(--accent-glass); border: 1px solid rgba(147,51,234,0.35); color: #c084fc; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; padding: 0 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; text-decoration: none; white-space: nowrap; font-family: var(--font); }

        /* TOAST */
        .notice-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-md); padding: 10px 16px; z-index: 8000; opacity: 0; transition: all 0.3s ease; pointer-events: none; white-space: nowrap; }
        .notice-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-content { display: flex; align-items: center; gap: 8px; }

        /* HELPER - fallback watch btn used by JS */
        .watch-now-btn { width: 100%; height: 46px; background: linear-gradient(135deg, var(--accent), #7c3aed); border: none; border-radius: var(--radius-md); color: #fff; font-size: 14px; font-weight: 700; font-family: var(--font); display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; margin-top: 10px; }
    </style>
    <script>
        function handleImageError(imgEl, title = "") {
            if (!imgEl) return;
            imgEl.onerror = null;
            const displayTitle = (title || "OrbixPlay").trim();
            const encodedTitle = encodeURIComponent(displayTitle.length > 25 ? displayTitle.substring(0, 25) + "..." : displayTitle);
            imgEl.src = `https://placehold.co/400x600/1a1a24/a78bfa.svg?text=${encodedTitle}`;
        }
    </script>
</head>
<body class="mobile-body">

    <nav class="m-nav">
        <button class="m-nav-btn" onclick="history.back()" aria-label="Back">

    <div class="m-backdrop" id="heroBackdrop">

             onerror="if(this.src && !this.src.includes('image-proxy') && this.src.startsWith('http')) { this.src = getApiUrl() + '/image-proxy?url=' + encodeURIComponent(this.src); }">

                     onerror="if(this.src && !this.src.includes('image-proxy') && this.src.startsWith('http')) { this.src = getApiUrl() + '/image-proxy?url=' + encodeURIComponent(this.src); } else { handleImageError(this, document.getElementById('detailTitle')?.textContent); }">

    <main class="m-main">

        <div class="m-action-bar">

            <button class="m-icon-btn" id="wishlistBtn" onclick="toggleWishlist()" title="Wishlist">
                <i data-lucide="heart" style="width:18px;height:18px;"></i>

            <button class="m-icon-btn" onclick="refreshDetails()" title="Refresh">

        <div class="m-specs-grid">

        <!-- Synopsis removed from here — now inline in hero area -->

        <div id="seasonCardBox" style="display:none;">

        <div id="episodesSection">

    </main>

    <!-- PLAYER OVERLAY -->
    <div id="playerOverlay" class="m-player-overlay" style="display:none;">
        <!-- Player Header -->
        <div class="m-player-header">
            <span class="m-player-title" id="playerMediaTitle">Now Playing</span>

                <button class="m-player-ctrl-btn" id="srcToggleBtn" onclick="toggleSourcePanel()" title="Switch Source">
                    <i data-lucide="layers" style="width:16px;height:16px;"></i>
                    <span id="srcBtnLabel">Source</span>

                <button class="m-player-ctrl-btn" onclick="tryPip()" title="PiP">

                <button class="m-player-close" onclick="closePlayerModal()">&#10005;</button>

        <!-- Video -->
        <div class="m-player-body">
            <video id="mobileVideoPlayer"
                controls
                playsinline
                webkit-playsinline
                preload="auto"
                style="width:100%;height:100%;background:#000;display:block;"
                referrerpolicy="no-referrer">
            </video>
            <!-- Loading indicator over video -->
            <div id="playerLoadingBadge" style="position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;font-size:12px;font-family:var(--font);padding:6px 14px;border-radius:20px;display:none;pointer-events:none;">
                Loading stream...
            </div>

        <!-- SOURCE SELECTOR PANEL (slides up inside player) -->
        <div id="sourceSelectorPanel" class="source-panel" style="display:none;">

            <div class="source-panel-header">
                <span class="source-panel-title">Select Stream Source</span>
                <button class="source-panel-close" onclick="toggleSourcePanel()">&#10005;</button>

            <div id="sourceSelectorList" class="source-list"></div>

        <!-- Fallback artplayer container (desktop compat) -->
        <div id="artplayerContainer" style="display:none;width:100%;height:100%;"></div>

    <div id="downloadModal" class="m-modal-overlay" style="display:none;" onclick="closeDownloadModal()">
        <div class="m-modal" onclick="event.stopPropagation()">
            <div class="m-modal-handle"></div>
            <div class="m-modal-title" id="downloadModalTitle">Download Options</div>
            <div id="downloadModalBody"></div>
            <button class="m-modal-close-btn" onclick="closeDownloadModal()">Close</button>
        </div>
    </div>

    <!-- PRE-PLAY SOURCES SELECTOR MODAL -->
    <div id="playSourcesModal" class="m-modal-overlay" style="display:none;" onclick="closePlaySourcesModal()">
        <div class="m-modal" onclick="event.stopPropagation()">
            <div class="m-modal-handle"></div>
            <div class="m-modal-title" id="playSourcesModalTitle">Select Playback Source</div>
            <div id="playSourcesModalBody"></div>
            <button class="m-modal-close-btn" onclick="closePlaySourcesModal()">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
    <script src="app.js"></script>
    <script>
        function scrollToEpisodes() {
            document.getElementById("episodesSection")?.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        function refreshDetails() {
            const params = new URLSearchParams(window.location.search);
            const link = params.get("link");
            const provider = params.get("provider") || localStorage.getItem("orbix_last_provider") || "vega";
            const title = params.get("title");
            if (link) {
                const container = document.getElementById("linksContainer");
                if (container) container.innerHTML = '<div class="m-loader"><div class="m-spinner"></div></div>';
                showDetails(link, provider, null, null, null, null, title);
            }
        }
        function toggleMobileSeasonDrop() {
            const menu = document.getElementById("mobileSeasonDropMenu");
            const chevron = document.getElementById("seasonChevron");
            if (!menu) return;
            const isHidden = menu.style.display === "none";
            menu.style.display = isHidden ? "block" : "none";
            if (chevron) {
                chevron.style.transform = isHidden ? "rotate(180deg)" : "rotate(0deg)";
            }
        }
        document.addEventListener("click", (e) => {
            const wrap = document.querySelector(".m-season-dropdown-wrap");
            const menu = document.getElementById("mobileSeasonDropMenu");
            const chevron = document.getElementById("seasonChevron");
            if (menu && wrap && !wrap.contains(e.target)) {
                menu.style.display = "none";
                if (chevron) chevron.style.transform = "rotate(0deg)";
            }
        });
        // =============================================
        // MOBILE NATIVE PLAYER
        // =============================================
        let _mobileHls = null;
        let _mobileStreams = [];  // all resolved streams
        let _currentSrcIndex = -1;

        // Detect format from URL string
        function detectFormat(url) {
            if (!url) return "unknown";
            const u = url.toLowerCase().split("?")[0];
            if (u.includes(".m3u8") || u.includes("/m3u8") || u.includes("hls")) return "m3u8";
            if (u.includes(".mp4")) return "mp4";
            if (u.includes(".mkv")) return "mkv";
            if (u.includes(".webm")) return "webm";
            if (u.includes(".avi")) return "avi";
            if (u.includes(".ts") || u.includes(".mpg") || u.includes(".mpeg")) return "ts";
            return "auto";
        }

        // Dynamically parse stream quality from stream details (not hardcoded)
        function parseStreamQuality(stream) {
            if (stream.quality) {
                const q = String(stream.quality).toLowerCase();
                if (q.includes("p") || q.includes("k") || q.includes("hd")) return q.toUpperCase();
                return q.toUpperCase() + "P";
            }
            const textToSearch = ((stream.link || stream.url || "") + " " + (stream.server || "")).toLowerCase();
            const match = textToSearch.match(/\b(2160p|1080p|720p|480p|360p|2k|4k)\b/i);
            if (match) return match[1].toUpperCase();
            return "HD";
        }

        function getFormatBadgeClass(fmt) {
            if (fmt === "m3u8") return "src-fmt-m3u8";
            if (fmt === "mp4") return "src-fmt-mp4";
            if (fmt === "mkv") return "src-fmt-mkv";
            return "src-fmt-other";
        }

        function formatLabel(fmt) {
            const map = { m3u8: "HLS", mp4: "MP4", mkv: "MKV", webm: "WebM", avi: "AVI", ts: "MPEG-TS", auto: "Stream", unknown: "Stream" };
            return (map[fmt] || fmt).toUpperCase();
        }

        function teardownPlayer() {
            const video = document.getElementById("mobileVideoPlayer");
            if (_mobileHls) { try { _mobileHls.destroy(); } catch(e) {} _mobileHls = null; }
            if (video) { video.pause(); video.removeAttribute("src"); video.load(); }
        }

        function closePlayerModal() {
            const overlay = document.getElementById("playerOverlay");
            if (overlay) overlay.style.display = "none";
            teardownPlayer();
            document.getElementById("sourceSelectorPanel").style.display = "none";
            try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {}
        }

        function toggleSourcePanel() {
            const panel = document.getElementById("sourceSelectorPanel");
            if (!panel) return;
            const open = panel.style.display !== "none";
            panel.style.display = open ? "none" : "block";
        }

        function renderSourceList(streams, activeIdx) {
            const list = document.getElementById("sourceSelectorList");
            if (!list) return;
            list.innerHTML = "";
            const btn = document.getElementById("srcBtnLabel");
            if (btn) btn.textContent = `${activeIdx + 1}/${streams.length}`;

            streams.forEach((s, i) => {
                const url = s.link || s.url || s.file || s.src || "";
                const fmt = detectFormat(url);
                const fmtClass = getFormatBadgeClass(fmt);
                const fmtLabel = formatLabel(fmt);
                const quality = s.quality ? String(s.quality) : "";
                const qualLabel = quality ? (quality.toLowerCase().includes("p") || quality.toLowerCase().includes("k") ? quality.toUpperCase() : quality + "P") : "";
                const server = s.server || s.source || s.name || `Source ${i + 1}`;

                const item = document.createElement("div");
                item.className = "source-item" + (i === activeIdx ? " active" : "");
                item.onclick = () => playStreamByIndex(i);
                item.innerHTML = `
                    <div class="source-item-num">${i + 1}</div>
                    <div class="source-item-info">
                        <div class="source-item-server">${server}</div>
                        <div class="source-item-tags">
                            <span class="src-fmt-badge ${fmtClass}">${fmtLabel}</span>
                            ${qualLabel ? `<span class="src-quality-badge">${qualLabel}</span>` : ""}
                        </div>
                    </div>
                    <button class="source-item-play" title="Play this source">
                        ${i === activeIdx ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>` : `<svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>`}
                    </button>`;
                list.appendChild(item);
            });
        }

        function playStreamByIndex(index) {
            if (!_mobileStreams || index < 0 || index >= _mobileStreams.length) return;
            _currentSrcIndex = index;
            const s = _mobileStreams[index];
            const url = s.link || s.url || s.file || s.src || "";
            const title = document.getElementById("playerMediaTitle")?.textContent || "";
            renderSourceList(_mobileStreams, index);
            document.getElementById("sourceSelectorPanel").style.display = "none";
            loadVideoUrl(url, title);
        }

        function loadVideoUrl(streamUrl, title) {
            const video = document.getElementById("mobileVideoPlayer");
            const overlay = document.getElementById("playerOverlay");
            const titleEl = document.getElementById("playerMediaTitle");
            const badge = document.getElementById("playerLoadingBadge");
            if (!video || !overlay) return;

            teardownPlayer();
            if (titleEl) titleEl.textContent = title || "Now Playing";
            overlay.style.display = "flex";
            if (badge) { badge.style.display = "block"; badge.textContent = "Loading stream..."; }

            const fmt = detectFormat(streamUrl);
            const isHls = (fmt === "m3u8");

            // MKV / non-streamable formats: open in browser download or new tab
            if (fmt === "mkv" || fmt === "avi") {
                if (badge) badge.style.display = "none";
                // Try setting src anyway (some browsers can play MKV)
                video.src = streamUrl;
                video.play().catch(() => {
                    // Fallback: open in new tab
                    window.open(streamUrl, "_blank");
                });
                return;
            }

            if (isHls && typeof Hls !== "undefined" && Hls.isSupported()) {
                _mobileHls = new Hls({
                    maxBufferLength: 60,
                    maxMaxBufferLength: 300,
                    enableWorker: true,
                    xhrSetup: (xhr) => { xhr.setRequestHeader("Referer", ""); }
                });
                _mobileHls.loadSource(streamUrl);
                _mobileHls.attachMedia(video);
                _mobileHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    if (badge) badge.style.display = "none";
                    video.play().catch(() => {});
                });
                _mobileHls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (badge) { badge.style.display = "block"; badge.textContent = "Stream error. Try another source."; }
                        _mobileHls.destroy(); _mobileHls = null;
                    }
                });
            } else if (isHls && video.canPlayType("application/vnd.apple.mpegurl")) {
                // Safari native HLS
                video.src = streamUrl;
                video.play().catch(() => {});
                if (badge) badge.style.display = "none";
            } else {
                // MP4, WebM, TS, auto — direct src
                video.src = streamUrl;
                video.play().catch(() => {});
                video.oncanplay = () => { if (badge) badge.style.display = "none"; };
            }

            // Auto-request fullscreen
            video.onfullscreenerror = null;
        }

        function tryPip() {
            const video = document.getElementById("mobileVideoPlayer");
            if (!video) return;
            if (document.pictureInPictureElement) {
                document.exitPictureInPicture().catch(() => {});
            } else if (video.requestPictureInPicture) {
                video.requestPictureInPicture().catch(() => {});
            }
        }

        function closePlaySourcesModal() {
            const modal = document.getElementById("playSourcesModal");
            if (modal) modal.style.display = "none";
        }

        // Override playStream for mobile — shows source selector first
        window.playStream = async function(link, provider, episodeTitle) {
            const modal = document.getElementById("playSourcesModal");
            const body = document.getElementById("playSourcesModalBody");
            const titleEl = document.getElementById("playSourcesModalTitle");
            if (!modal || !body) return;

            if (titleEl) titleEl.textContent = episodeTitle || "Select Stream Source";
            modal.style.display = "flex";
            body.innerHTML = '<div class="loader dl-loader"><div class="spinner" style="width:28px;height:28px;border-width:2px;"></div><p style="font-size:13px;color:var(--text-dim);">Resolving video links...</p></div>';

            const streams = await getResolvedStreams(link, provider);
            body.innerHTML = "";

            if (!streams || !streams.length) {
                body.innerHTML = '<p style="color:#ef4444;font-size:13px;text-align:center;padding:20px;">No playable stream links found.</p>';
                return;
            }

            _mobileStreams = streams;

            streams.forEach((s, idx) => {
                const url = s.link || s.url || s.file || s.src || "";
                const fmt = detectFormat(url);
                const fmtClass = getFormatBadgeClass(fmt);
                const fmtLabel = formatLabel(fmt);
                const qText = parseStreamQuality(s);
                const serverText = s.server ? ("Server: " + s.server) : "Direct Stream";

                const card = document.createElement("div");
                card.className = "dl-stream-card";
                card.style.cursor = "pointer";
                card.onclick = () => {
                    closePlaySourcesModal();
                    _currentSrcIndex = idx;
                    renderSourceList(streams, idx);
                    loadVideoUrl(url, episodeTitle || s.server || "Now Playing");
                    const srcBtn = document.getElementById("srcToggleBtn");
                    if (srcBtn) srcBtn.style.opacity = streams.length > 1 ? "1" : "0.4";
                };

                card.innerHTML = `
                    <div class="dl-stream-info">
                        <div class="dl-quality-row">
                            <span class="dl-quality-badge">${qText}</span>
                            <span class="src-fmt-badge ${fmtClass}" style="padding:1px 5px;font-size:9px;">${fmtLabel}</span>
                            <span class="dl-server-tag">${serverText}</span>
                        </div>
                    </div>
                    <div class="dl-actions">
                        <button class="dl-action-btn" style="border-radius:50%;width:34px;height:34px;padding:0;justify-content:center;background:var(--accent);">
                            <i data-lucide="play" style="width:14px;height:14px;fill:white;color:white;"></i>
                        </button>
                    </div>
                `;
                body.appendChild(card);
            });

            if (window.lucide) lucide.createIcons();
        };
        window.resolveDownload = async function(link, provider, title) {
            const modal = document.getElementById("downloadModal");
            const body = document.getElementById("downloadModalBody");
            const titleEl = document.getElementById("downloadModalTitle");
            if (!modal || !body) return;
            if (titleEl) titleEl.textContent = title || "Download Options";
            modal.style.display = "flex";
            body.innerHTML = '<div class="loader dl-loader"><div class="spinner" style="width:28px;height:28px;border-width:2px;"></div><p style="font-size:13px;color:var(--text-dim);">Extracting links...</p></div>';
            const streams = await getResolvedStreams(link, provider);
            body.innerHTML = "";
            if (!streams || !streams.length) {
                body.innerHTML = '<p style="color:#ef4444;font-size:13px;text-align:center;padding:20px;">No download links found.</p>';
                return;
            }
            streams.forEach(s => {
                const qText = parseStreamQuality(s);
                const serverText = s.server ? ("Server: " + s.server) : "Direct Stream";
                const card = document.createElement("div");
                card.className = "dl-stream-card";
                const safeLink = (s.link || "").replace(/'/g, "\\'");
                card.innerHTML = '<div class="dl-stream-info"><div class="dl-quality-row"><span class="dl-quality-badge">' + qText + '</span><span class="dl-server-tag">' + serverText + '</span></div></div><div class="dl-actions"><button class="copy-link-btn" onclick="navigator.clipboard.writeText(\'' + safeLink + '\');showScrollToast(\'Link copied!\');"><i data-lucide="copy" style="width:15px;height:15px;"></i></button><a href="' + safeLink + '" target="_blank" rel="noreferrer" class="dl-action-btn"><i data-lucide="download" style="width:13px;height:13px;"></i> Download</a></div>';
                body.appendChild(card);
            });
            if (window.lucide) lucide.createIcons();
        };
        function toggleTheme() {
            const current = document.documentElement.getAttribute("data-theme") || "dark";
            const target = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", target);
            localStorage.setItem("orbix_theme", target);
            updateThemeIcon(target);
        }
        function updateThemeIcon(theme) {
            const icon = document.getElementById("themeBtnIcon");
            if (!icon) return;
            if (theme === "light") {
                icon.setAttribute("data-lucide", "moon");
            } else {
                icon.setAttribute("data-lucide", "sun");
            }
            if (window.lucide) window.lucide.createIcons();
        }
        function closeDownloadModal() {
            const modal = document.getElementById("downloadModal");
            if (modal) modal.style.display = "none";
        }
        document.addEventListener("DOMContentLoaded", async () => {
            const theme = localStorage.getItem("orbix_theme") || "dark";
            document.documentElement.setAttribute("data-theme", theme);
            updateThemeIcon(theme);
            if (window.lucide) lucide.createIcons();
            const params = new URLSearchParams(window.location.search);
            const link = params.get("link");
            const provider = params.get("provider") || localStorage.getItem("orbix_last_provider") || "vega";
            const title = params.get("title");
            if (!link) return;
            // Wait for app.js loadProviders() to finish populating providersMap
            try { await window._providersReady; } catch(e) {}
            showDetails(link, provider, null, null, null, null, title);
        });
    </script>
